query PreviewById($id: ID!) {
	# asPreview: true tells WPGraphQL to return the latest autosave/revision
	# (the unsaved editor changes) rather than the published content.
	page(id: $id, idType: DATABASE_ID, asPreview: true) {
		__typename
		id
		databaseId
		title
		date
		status
		modified
		editorBlocks {
			...CommonBlockFields
		}
	}

	# Also try as post, likewise returning the latest autosave/revision.
	post(id: $id, idType: DATABASE_ID, asPreview: true) {
		__typename
		id
		databaseId
		title
		date
		status
		modified
		featuredImage {
			node {
				altText
				mediaDetails {
					sizes {
						name
						mimeType
						height
						width
						sourceUrl
					}
				}
			}
		}
		editorBlocks {
			...CommonBlockFields
		}
	}
}

fragment BlockBasicFields on EditorBlock {
	name
	parentClientId
	clientId
	type
}

fragment CommonBlockFields on EditorBlock {
	...BlockBasicFields
	... on CoreVideo {
		attributes {
			autoplay
			preload
			src
			metadata
			muted
			controls
			caption
			poster
			align
			loop
			className
		}
	}
	... on CorePostTitle {
		renderedHtml
		attributes {
			className
			fontFamily
			fontSize
			textColor
			textAlign
			level
			align
		}
	}
	... on CoreEmbed {
		renderedHtml
		attributes {
			align
			url
		}
	}
	... on CoreImage {
		mediaDetails {
			sizes(exclude: [MEDIUM_LARGE, MEDIUM]) {
				sourceUrl
				height
				width
				mimeType
				name
			}
		}
		attributes {
			title
			alt
			url
			caption
			aspectRatio
			scale
			width
			height
			href
			linkTarget
			className
		}
	}
	... on CoreParagraph {
		attributes {
			content
			fontFamily
			fontSize
			textColor
			align
			className
			cssClassName
		}
	}
	... on CoreFootnotes {
		renderedHtml
		innerBlocks {
			name
		}
		attributes {
			metadata
		}
	}
	... on CoreMore {
		attributes {
			customText
		}
	}
	... on CoreList {
		attributes {
			ordered
			reversed
			start
			textColor
			type
		}
	}
	... on CoreListItem {
		attributes {
			content
			fontSize
			fontFamily
			textColor
		}
	}
	... on CoreAccordionItem {
		attributes {
		openByDefault
		}
	}
	... on CoreAccordionHeading {
		attributes {
			fontSize
			fontFamily
			showIcon
			style
			title
		}
	}
	... on CoreHeading {
		attributes {
			content
			className
			cssClassName
			fontFamily
			fontSize
			textColor
			level
			align
		}
	}
	... on CoreColumns {
		attributes {
			backgroundColor
			layout
			className
			verticalAlignment
			style
			align
			isStackedOnMobile
		}
	}
	... on CoreColumn {
		attributes {
			backgroundColor
			layout
			className
			verticalAlignment
			width
			style
		}
	}
	... on CoreGroup {
		attributes {
			backgroundColor
			align
			style
			layout
			sectionBehavior
			sectionMinHeight
			sectionContentAlign
			sectionReveal
			sectionRevealDirection
			sectionRevealStagger
			sectionParallax
		}
	}
	... on CoreButton {
		attributes {
			backgroundColor
			style
			fontSize
			linkTarget
			text
			url
		}
		innerBlocks {
			apiVersion
			blockEditorCategoryName
			clientId
			name
			parentClientId
			renderedHtml
		}
	}
	... on CoreButtons {
		attributes {
			align
			layout
		}
	}
	... on CoreSpacer {
		attributes {
			height
			style
		}
	}
	... on CoreQuote {
		attributes {
			citation
			layout
			textAlign
			className
			fontFamily
			fontSize
			textColor
			align
			value
		}
	}
}
